CONFIG_ZTEST=y # Enable the Ztest unit testing framework
CONFIG_ZTEST_SHUFFLE=n # Randomize suite and test order to catch ordering dependencies early

CONFIG_LOG=y # Enable logging
CONFIG_CONSOLE=y


CONFIG_USB_CDC_ACM=y #for usb_cdc_acm as consol backend interface 
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_VID=0x2fe3
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y


